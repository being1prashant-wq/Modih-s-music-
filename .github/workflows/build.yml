name: Build Modih's Music Player

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project
        run: |
          echo "Repository structure:"
          find . -maxdepth 3 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)")
          echo "Gradle project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modih-Music-Debug
          path: "**/build/outputs/apk/debug/*.apk"
