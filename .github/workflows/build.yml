name: Build Modih's Music Player

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

      - name: Force Media3 1.4.1
        shell: bash
        run: |
          set -e

          echo "Gradle files:"
          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print

          echo "Replacing Media3 versions..."

          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/androidx\.media3:([^:"]+):[0-9]+\.[0-9]+\.[0-9]+/androidx.media3:\1:1.4.1/g' {} \;

          echo "Current Media3 references:"
          grep -Rni "media3" "$PROJECT_DIR" --include="*.gradle" --include="*.gradle.kts" || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modih-Music-Debug
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
