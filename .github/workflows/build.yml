name: Build Modih's Music Player

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Extracted project:"
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Repair Android resources
        shell: bash
        run: |
          set -e

          echo "Checking Android resources..."

          RES="$PROJECT_DIR/app/src/main/res/values"

          if [ -d "$RES" ]; then

            # Make sure app_name is a valid Android XML resource.
            if [ -f "$RES/strings.xml" ]; then
              python3 - "$RES/strings.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          try:
              ET.parse(path)
              print("strings.xml XML syntax is valid.")
          except Exception as e:
              print("Invalid strings.xml:", e)
              raise
          PY
            fi

          fi

      - name: Align Media3 versions
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$GRADLE_FILE" ]; then
            echo "Checking Media3 dependencies..."

            sed -i \
              -E 's/androidx\.media3:([^:"]+):[0-9]+\.[0-9]+\.[0-9]+/androidx.media3:\1:1.4.1/g' \
              "$GRADLE_FILE"

            echo "Media3 dependencies:"
            grep -n "media3:" "$GRADLE_FILE" || true
          fi

      - name: Show project structure
        shell: bash
        run: |
          echo "Project:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -150

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          gradle clean assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modih-Music-Debug
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
