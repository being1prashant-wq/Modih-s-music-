name: Build Modih's Music Player

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract project
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          echo "Using: $ZIP"

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle project found."
            find project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$PROJECT_DIR"

      - name: Fix Android resources
        run: |
          set -e

          STRINGS="$PROJECT_DIR/app/src/main/res/values/strings.xml"

          echo "Checking:"
          echo "$STRINGS"

          if [ -f "$STRINGS" ]; then
            python3 <<PY
          from pathlib import Path

          p = Path("$STRINGS")
          text = p.read_text(encoding="utf-8")

          # Fix common Android XML apostrophe/resource problems.
          text = text.replace(
              "Modih's Music Player",
              "Modih\\'s Music Player"
          )

          text = text.replace(
              "Modih&apos;s Music Player",
              "Modih\\'s Music Player"
          )

          p.write_text(text, encoding="utf-8")

          print("Fixed strings.xml:")
          print(p.read_text(encoding="utf-8"))
          PY
          else
            echo "strings.xml not found"
          fi

      - name: Show Gradle project
        run: |
          cd "$PROJECT_DIR"
          ls -la
          echo "Settings:"
          cat settings.gradle.kts 2>/dev/null || cat settings.gradle

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modih-Music-Debug
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
