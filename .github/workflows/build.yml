name: Build Modih's Music Player

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP"

          echo "ZIP_PROJECT=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q "$ZIP_PROJECT" -d project

          echo "Extracted files:"
          find project -maxdepth 4 -type f | head -150

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

      - name: Fix app name resource
        shell: bash
        run: |
          set -e

          RES_DIR="$PROJECT_DIR/app/src/main/res/values"
          STRINGS="$RES_DIR/strings.xml"

          mkdir -p "$RES_DIR"

          echo "Writing clean Android strings.xml"

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<resources>' \
            '    <string name="app_name">Modih Music Player</string>' \
            '</resources>' \
            > "$STRINGS"

          echo "Final strings.xml:"
          cat "$STRINGS"

      - name: Force Media3 1.4.1
        shell: bash
        run: |
          set -e

          echo "Checking Media3 dependencies..."

          find "$PROJECT_DIR" -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -exec sed -i -E \
            's/androidx\.media3:([^:"]+):[0-9]+\.[0-9]+\.[0-9]+/androidx.media3:\1:1.4.1/g' {} \;

          echo "Media3 references:"
          grep -Rni "androidx.media3:" "$PROJECT_DIR" \
            --include="*.gradle" \
            --include="*.gradle.kts" || true

      - name: Show project structure
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo "Files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Clean previous build
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean

      - name: Fix LibraryScreen Kotlin syntax
        shell: bash
        run: |
          set -e

          FILE=$(find "$PROJECT_DIR" -name "LibraryScreen.kt" -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: LibraryScreen.kt not found."
            exit 1
          fi

          echo "========================================"
          echo "Checking LibraryScreen.kt"
          echo "File: $FILE"
          echo "========================================"

          echo "Before fix:"
          nl -ba "$FILE" | sed -n '95,115p'

          # Fix the exact syntax problem found at line 105:
          # }    renamePlaylist?.let { oldName ->
          #
          # It must become:
          # }
          # renamePlaylist?.let { oldName ->

          perl -0pi -e 's/\}\s+renamePlaylist\?\.let/\}\n    renamePlaylist?.let/' "$FILE"

          echo ""
          echo "After fix:"
          nl -ba "$FILE" | sed -n '95,115p'

          echo ""
          echo "LibraryScreen.kt syntax patch completed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "Building Modih Music Player..."
          echo "========================================"

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK output:"
          echo "========================================"

          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Modih-Music-Debug
          path: "project/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
